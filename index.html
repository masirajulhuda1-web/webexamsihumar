<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBT - Madrasah Aliyah Sirajul Huda Marindi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="kartu-login">
    <img 
      src="assets/logo-ma-sirajul-huda.png" 
      alt="Logo MA Sirajul Huda Marindi" 
      class="logo-sekolah"
      style="width: 92px; height: 92px; object-fit: contain;"
    />
    <h1 class="nama-sekolah">Madrasah Aliyah Sirajul Huda Marindi</h1>
    <p class="subjudul-app">Aplikasi Ujian Berbasis Komputer (CBT)</p>

    <form id="form-login" class="form-login">
      <div class="grup-input">
        <label for="nis">Nomor Induk Siswa (NIS)</label>
        <input type="text" id="nis" placeholder="Contoh: 0079316053" autocomplete="off" required />
      </div>

      <div class="grup-input">
        <label for="token">Token Ujian</label>
        <input type="text" id="token" placeholder="Masukkan token ujian" autocomplete="off" required />
      </div>

      <div id="info-jadwal-siswa" style="display: none; font-size: 0.85rem; padding: 9px 11px; border-radius: 8px; margin-bottom: 12px;"></div>

      <div id="grup-pilih-mapel" class="grup-input" style="display: none;">
        <label for="mapel">Mata Pelajaran Aktif</label>
        <select id="mapel" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff;">
          <option value="">-- Pilih Mata Pelajaran --</option>
        </select>
      </div>

      <div id="pesan-error" style="display: none; font-size: 0.88rem; margin-top: 4px; margin-bottom: 8px;"></div>

      <button type="submit" id="btn-masuk" class="tombol-masuk">Masuk Ujian</button>
    </form>

    <footer class="footer-app">
      <p style="margin-top: 8px;">
        <a href="guru.html" style="color: inherit; text-decoration: underline;">Masuk Panel Guru</a>
      </p>
      <p>Madrasah Aliyah Sirajul Huda Marindi</p>
      <p>Pengembang Aplikasi: <strong>Siti Aisyah</strong></p>
    </footer>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
